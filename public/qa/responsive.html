<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JUNA 响应式检查</title><style>html{color-scheme:dark}body{margin:0;background:#101720;color:#dbe9f6;font:14px Arial,sans-serif}header{padding:16px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:1px solid #345}button,select{min-height:44px;padding:10px 14px;background:#182838;border:1px solid #678;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#345c7b}main{padding:20px;overflow:auto}iframe{display:block;margin:auto;background:#05090f;border:1px solid #567;box-shadow:0 12px 60px #0005}label{display:flex;gap:8px;align-items:center}p{margin:0;color:#9ab3cb}a{color:#b8d9f7}#status{padding:0 22px 20px;font-variant-numeric:tabular-nums}</style></head><body><header><strong>JUNA 响应式检查</strong><div role="group" aria-label="视口尺寸"><button data-width="360" data-height="800" aria-pressed="true">360 px</button><button data-width="390" data-height="844" aria-pressed="false">390 px</button><button data-width="430" data-height="932" aria-pressed="false">430 px</button><button data-width="844" data-height="390" aria-pressed="false">横屏 844 px</button></div><label>页面<select id="page"><option value="/juna/?lang=zh">首页</option><option value="/juna/?lang=zh#facility">实验装置</option><option value="/juna/?lang=zh&r=neutron#science">核反应探测</option><option value="/juna/?lang=zh#publications">论文列表</option><option value="/juna/publications/cno-breakout-2022/?lang=zh">论文详情</option><option value="/juna/research/magnesium/?lang=zh">研究详情</option></select></label><label>语言<select id="lang"><option value="zh">中文</option><option value="en">English</option></select></label><a href="/juna/">网站首页</a></header><main><iframe id="site" title="JUNA 受控视口预览" src="/juna/?lang=zh" width="360" height="800"></iframe></main><p id="status" role="status">视口 360 × 800。用于布局检查，不模拟设备性能。</p><script>const frame=document.getElementById('site');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.width=b.dataset.width;frame.height=b.dataset.height;document.getElementById('status').textContent=`视口 ${frame.width} × ${frame.height}。用于布局检查，不模拟设备性能。`}));function navigate(){const url=new URL(document.getElementById('page').value,location.origin);url.searchParams.set('lang',document.getElementById('lang').value);frame.src=url.pathname+url.search+url.hash}document.getElementById('page').addEventListener('change',navigate);document.getElementById('lang').addEventListener('change',navigate);</script></body></html>
